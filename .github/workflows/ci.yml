name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'maven'
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Compile and test-compile with Maven
        run: ./mvnw -B test-compile
